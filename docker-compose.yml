# 本地开发基础设施（npm run local:up，design.md 10.2）
# 仅 PostgreSQL + pgvector：Redis / MinIO 属于 design.md 6.3 的后续阶段预留，当前无代码使用，故不再启动容器
# 注：如已使用本机自装 PostgreSQL（.env 的 DATABASE_URL），可删除 postgres 服务
services:
  postgres:
    # 官方 pgvector 镜像，内置向量扩展（design.md 6.1）
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
